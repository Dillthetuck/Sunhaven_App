<html lang="en">

<title>Sunhaven — Portfolio care</title>
<style>
:root{--ink:#21302d;--muted:#6f7d77;--line:#e4e8e1;--paper:#fff;--canvas:#f6f7f3;--teal:#29665d;--teal-dark:#1f514a;--mint:#e8f1ec;--gold:#b77432;--gold-bg:#fbf1e4;--blue:#52727f;--blue-bg:#edf3f5;--red:#9b5548;--red-bg:#f7ebe8;--shadow:0 12px 35px rgba(29,55,46,.07);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{height:70px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em;font-size:19px}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--teal);color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:23px;font-weight:500}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-top:-4px}.top-actions{display:flex;align-items:center;gap:12px}.demo-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8d6032;background:var(--gold-bg);padding:7px 10px;border-radius:100px;font-weight:750}.role-switch{display:flex;align-items:center;padding:4px;background:#f1f3ef;border:1px solid var(--line);border-radius:11px;gap:3px}.role-switch button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700}.role-switch button.active{background:white;color:var(--ink);box-shadow:0 1px 4px #152c2415}.layout{max-width:1320px;margin:34px auto;padding:0 30px 60px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);font-weight:800}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.page-head h1{margin:4px 0 5px;font-size:31px;letter-spacing:-.04em;line-height:1.15}.page-head p{margin:0;color:var(--muted);max-width:650px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;font-size:13px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--teal);color:white}.btn-primary:hover{background:var(--teal-dark)}.btn-quiet{background:#f4f6f2;color:var(--ink);border:1px solid var(--line)}.btn-outline{background:white;border:1px solid var(--line);color:var(--ink)}.btn-sm{padding:7px 11px;font-size:12px}.staff-grid{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.queue{overflow:hidden}.panel-title{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-title h2{font-size:15px;margin:0;letter-spacing:-.01em}.count{font-size:11px;color:var(--muted);background:#f2f4f0;padding:4px 8px;border-radius:100px;font-weight:700}.queue-filter{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.queue-item{padding:16px;border-bottom:1px solid #eff1ed;cursor:pointer;position:relative}.queue-item:hover,.queue-item.selected{background:#f7faf7}.queue-item.selected:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}.queue-item:last-child{border-bottom:0}.queue-name{display:flex;justify-content:space-between;gap:10px;font-weight:730;font-size:13px}.queue-item p{color:var(--muted);font-size:12px;margin:6px 0}.queue-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.dot{width:7px;height:7px;display:inline-block;border-radius:50%;background:var(--gold);vertical-align:middle;margin-right:5px}.dot.green{background:#52836d}.work-area{display:flex;flex-direction:column;gap:18px}.account-banner{padding:22px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.account-banner h2{font-size:22px;letter-spacing:-.035em;margin:3px 0 4px}.account-banner p{margin:0;color:var(--muted);font-size:13px}.account-info{display:flex;gap:23px;margin-top:17px}.info-pair span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:750}.info-pair strong{font-size:12px}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:100px;font-size:11px;font-weight:750;white-space:nowrap}.badge.warm{background:var(--gold-bg);color:#8a5d2f}.badge.cool{background:var(--blue-bg);color:#466774}.badge.green{background:var(--mint);color:#34664e}.badge.gray{background:#f0f2ef;color:#69766f}.staff-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px}.staff-tabs button{background:none;border:0;padding:14px 12px;color:var(--muted);font-size:12px;font-weight:700;border-bottom:2px solid transparent}.staff-tabs button.active{color:var(--teal);border-color:var(--teal)}.tab-content{padding:20px 22px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:15px;letter-spacing:-.015em}.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.property-list,.request-list{display:grid;gap:9px}.row-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.row-main{display:flex;align-items:center;gap:12px;min-width:0}.property-icon{height:38px;width:38px;border-radius:11px;background:var(--mint);color:var(--teal);display:grid;place-items:center;flex:none}.row-main strong{display:block;font-size:13px}.row-main small{color:var(--muted);font-size:11px}.row-end{text-align:right;font-size:11px;color:var(--muted)}.row-end strong{display:block;color:var(--ink);font-size:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini-panel{border:1px solid var(--line);border-radius:12px;padding:15px}.mini-panel h4{font-size:12px;margin:0 0 11px}.entity-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #f0f1ee;font-size:12px}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:26px 1fr;gap:10px;position:relative;padding-bottom:17px}.event:not(:last-child):before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--line)}.event-icon{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--teal);font-size:10px;z-index:1}.event strong{font-size:12px;display:block}.event p{font-size:11px;color:var(--muted);margin:2px 0}.note{border-radius:11px;background:#f7f8f5;padding:12px 14px;color:#53635b;font-size:12px}.note strong{color:var(--ink)}.note.warning{background:var(--gold-bg);color:#76542f}.note.blue{background:var(--blue-bg);color:#466774}.note.red{background:var(--red-bg);color:#875148}.flow-layout{max-width:1060px;margin:auto;display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:start}.flow-side{position:sticky;top:102px;padding-top:12px}.flow-side h2{font-size:15px;margin:0 0 18px}.step-list{display:grid;gap:7px}.step{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:650}.step.active{background:var(--mint);color:var(--teal)}.step.done{color:#466b59}.step-number{width:23px;height:23px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:10px;background:white}.step.active .step-number{background:var(--teal);color:white;border-color:var(--teal)}.step.done .step-number{background:#edf3ed;color:#477357;border-color:#edf3ed}.flow-card{padding:clamp(22px,4vw,38px)}.flow-card h2{margin:5px 0 6px;font-size:24px;letter-spacing:-.035em}.flow-card>p{margin:0 0 24px;color:var(--muted);font-size:13px}.progress-bar{height:5px;background:#edf0eb;border-radius:10px;margin:0 0 24px;overflow:hidden}.progress-bar span{display:block;height:100%;background:var(--teal);border-radius:10px;transition:width .3s}.form-label{display:block;font-weight:700;font-size:12px;margin-bottom:7px}.field{width:100%;padding:11px 12px;border:1px solid #dce2da;border-radius:9px;background:white;color:var(--ink);font-size:13px}.field:focus{outline:3px solid #b6d2c5;outline-offset:1px;border-color:var(--teal)}.field-wrap{margin:15px 0}.field-hint{font-size:11px;color:var(--muted);margin-top:5px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choice{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;background:white;color:var(--ink);min-height:118px}.choice:hover,.choice.selected{border-color:var(--teal);box-shadow:0 0 0 2px #d9e8e0}.choice .choice-icon{font-size:21px;margin-bottom:8px}.choice strong{display:block;font-size:13px}.choice small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.property-confirm{display:grid;gap:8px}.check-row{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px}.check-row input{accent-color:var(--teal);width:16px;height:16px}.check-row small{display:block;color:var(--muted)}.flow-actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#203b34;color:white;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.client-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}.client-header h1{font-family:Georgia,serif;font-weight:500;font-size:34px;letter-spacing:-.04em;margin:4px 0}.client-header p{margin:0;color:var(--muted)}.client-layout{max-width:1050px;margin:auto}.client-card{padding:22px;margin-bottom:16px}.client-card h2{font-size:16px;margin:0 0 15px}.client-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0 5px}.stat{padding:13px;background:#f7f8f5;border-radius:11px}.stat strong{display:block;font-size:20px;letter-spacing:-.04em}.stat span{font-size:11px;color:var(--muted)}.client-nav{display:flex;gap:5px;overflow:auto;margin-bottom:17px}.client-nav button{border:0;background:transparent;padding:9px 12px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}.client-nav button.active{background:var(--mint);color:var(--teal)}.client-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:24px 0}.progress-step{text-align:center;position:relative;font-size:10px;color:var(--muted)}.progress-step:not(:last-child):after{content:"";position:absolute;height:1px;background:var(--line);top:11px;left:calc(50% + 13px);right:calc(-50% + 13px)}.progress-step.done:not(:last-child):after{background:#9db9a7}.progress-step i{display:grid;place-items:center;margin:0 auto 8px;width:22px;height:22px;border-radius:50%;background:#edf0ec;color:#758279;font-style:normal;font-size:10px;position:relative;z-index:1}.progress-step.done i{background:var(--teal);color:white}.progress-step.current i{outline:3px solid #d9e9e1}.summary-item{padding:15px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.summary-item .type{font-size:10px;color:#8a5d2f;text-transform:uppercase;letter-spacing:.09em;font-weight:800}.summary-item p{font-size:13px;margin:6px 0;color:#43534c}.summary-item small{font-size:10px;color:var(--muted)}.split{display:grid;grid-template-columns:1fr 300px;gap:16px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.footnote{text-align:center;color:#839088;font-size:10px;padding:26px 10px 5px}.modal-backdrop{position:fixed;inset:0;background:#182b2580;display:none;place-items:center;z-index:30;padding:20px}.modal-backdrop.open{display:grid}.modal{background:white;border-radius:16px;padding:25px;max-width:480px;width:100%;box-shadow:0 25px 90px #172b2540}.modal h2{margin:0 0 8px;font-size:20px}.modal p{color:var(--muted);font-size:13px;margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.hidden{display:none!important}
@media(max-width:850px){.layout{padding:0 18px 45px;margin-top:24px}.staff-grid{grid-template-columns:1fr}.queue{display:grid;grid-template-columns:1fr}.queue .queue-items{display:grid;grid-template-columns:repeat(3,1fr)}.queue-item{border-right:1px solid #eff1ed}.flow-layout{grid-template-columns:1fr;gap:18px}.flow-side{position:static}.step-list{grid-template-columns:repeat(4,1fr);gap:4px}.step{justify-content:center;padding:7px;font-size:0}.step-number{font-size:10px}.split{grid-template-columns:1fr 260px}}
@media(max-width:600px){.topbar{height:62px;padding:0 14px}.brand{font-size:17px}.brandmark{width:31px;height:31px}.demo-tag{display:none}.role-switch button{padding:7px 9px;font-size:11px}.layout{padding:0 13px 34px;margin-top:19px}.page-head{display:block}.page-head h1{font-size:27px}.page-head>.btn{margin-top:15px}.staff-grid{gap:13px}.queue .queue-items{grid-template-columns:1fr}.queue-item{border-right:0}.account-banner{padding:18px;display:block}.account-info{gap:13px;flex-wrap:wrap}.account-banner>.badge{margin-top:12px}.staff-tabs{overflow:auto;padding:0 10px}.staff-tabs button{white-space:nowrap;padding:12px 9px}.tab-content{padding:16px 14px}.two-col{grid-template-columns:1fr}.row-card{align-items:flex-start}.row-end{max-width:105px}.flow-card{padding:22px 17px}.flow-card h2{font-size:21px}.choice-grid{grid-template-columns:1fr}.choice{min-height:auto}.client-header h1{font-size:29px}.client-header{display:block}.client-header>.badge{margin-top:10px}.client-card{padding:17px}.client-stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:10px 8px}.stat strong{font-size:17px}.stat span{font-size:10px}.split{grid-template-columns:1fr}.progress-step{font-size:9px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brandmark">S</div><div>sunhaven<small>portfolio care</small></div></div>
  <div class="top-actions"><span class="demo-tag">Illustrative demo</span><div class="role-switch" aria-label="Choose experience"><button id="staffMode" class="active" type="button">Staff view</button><button id="investorMode" type="button">Investor view</button></div></div>
</header>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<script>
const demo={account:{name:"Demo Investor Portfolio",owner:"Morgan Ellis",specialist:"Jordan Lee"},entities:[{id:"a",name:"Example Holdings LLC",auth:"Verified for demo"},{id:"b",name:"Example Rentals LLC",auth:"Verification needed"}],properties:[{id:1,label:"Example Property One",entity:"a",stage:"Rehab in progress",confirmed:true},{id:2,label:"Example Property Two",entity:"a",stage:"Rented",confirmed:true},{id:3,label:"Example Property Three",entity:"b",stage:"Rented",confirmed:false},{id:4,label:"Example Property Four",entity:"b",stage:"Vacant",confirmed:true}],policies:[{carrier:"Fictional Carrier",properties:[1],status:"Partial documents"},{carrier:"Fictional Portfolio Carrier",properties:[2,3],status:"Received · not reviewed"}],requests:[{entity:"a",contact:"Fictional Existing Agent",status:"Partial response",next:"Request missing endorsements",investor:false},{entity:"b",contact:"Help call needed",status:"Assistance required",next:"Arrange a call with the investor",investor:true}],findings:[{property:2,status:"Published",type:"Potential issue",text:"Reported occupancy differs from the document on file. A licensed reviewer recommends confirming the current policy and occupancy details.",reviewer:"Demo Licensed Reviewer",evidence:"Illustrative document · reviewed Nov 18, 2026"},{property:1,status:"Internal draft",type:"Missing information",text:"Review requires missing endorsements.",reviewer:"Not assigned",evidence:"No evidence attached"}]};
const state={mode:"staff",staffTab:"overview",clientTab:"home",flowStep:0,collection:"assisted",contact:"",propertyConfirmed:true,changeSubmitted:false,toastTimer:null};
const app=document.getElementById('app');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stageBadge(s){let cls=s.includes('Verified')||s.includes('Published')?'green':s.includes('needed')||s.includes('Partial')||s.includes('Assistance')?'warm':'cool';return `<span class="badge ${cls}">${esc(s)}</span>`}
function switchMode(mode){state.mode=mode;document.getElementById('staffMode').classList.toggle('active',mode==='staff');document.getElementById('investorMode').classList.toggle('active',mode==='investor');render()}
document.getElementById('staffMode').onclick=()=>switchMode('staff');document.getElementById('investorMode').onclick=()=>{state.clientTab='home';switchMode('investor')};
function render(){app.innerHTML=state.mode==='staff'?renderStaff():renderInvestor();bind()}
function renderStaff(){return `<div class="layout">
<div class="page-head"><div><div class="eyebrow">Service workspace</div><h1>Good morning, Jordan</h1><p>Keep the collection moving and give each investor a clear next step.</p></div><button class="btn btn-primary" data-action="new-task">＋ &nbsp;New collection task</button></div>
<div class="staff-grid"><aside class="panel queue"><div class="panel-title"><h2>Work queue</h2><span class="count">3 open</span></div><div class="queue-filter">Assigned to you &nbsp;⌄</div><div class="queue-items"><div class="queue-item selected" tabindex="0" data-action="select-account"><div class="queue-name"><span>Demo Investor Portfolio</span><span class="dot"></span></div><p>Partial response · 2 LLCs</p><div class="queue-meta"><span>Missing endorsements</span><span>Today</span></div></div><div class="queue-item" tabindex="0" data-action="select-account"><div class="queue-name"><span>Harbor Example Account</span><span class="dot"></span></div><p>Authorization check</p><div class="queue-meta"><span>Waiting on staff</span><span>Today</span></div></div><div class="queue-item" tabindex="0" data-action="select-account"><div class="queue-name"><span>Northstar Demo Group</span><span class="dot green"></span></div><p>Review ready</p><div class="queue-meta"><span>Reviewer handoff</span><span>Nov 21</span></div></div></div></aside>
<section class="work-area"><div class="panel account-banner"><div><div class="eyebrow">Account workspace · Demo only</div><h2>${demo.account.name}</h2><p>${demo.account.owner} · Service specialist ${demo.account.specialist}</p><div class="account-info"><div class="info-pair"><span>Entities</span><strong>2 LLCs</strong></div><div class="info-pair"><span>Properties</span><strong>4 properties</strong></div><div class="info-pair"><span>Collection</span><strong>Partial response</strong></div></div></div><span class="badge warm">Action needed</span></div>
<div class="panel"><nav class="staff-tabs" aria-label="Account sections"><button class="${state.staffTab==='overview'?'active':''}" data-tab="overview">Overview</button><button class="${state.staffTab==='collection'?'active':''}" data-tab="collection">Collection</button><button class="${state.staffTab==='documents'?'active':''}" data-tab="documents">Documents</button><button class="${state.staffTab==='review'?'active':''}" data-tab="review">Review</button><button class="${state.staffTab==='activity'?'active':''}" data-tab="activity">Activity</button></nav>${renderStaffTab()}</div></section></div>
<div class="footnote">Fictional portfolio data for design only. No policy records, carrier responses, or coverage determinations are real.</div></div>`}
function renderStaffTab(){if(state.staffTab==='overview')return `<div class="tab-content"><div class="section-head"><div><h3>Portfolio at a glance</h3><p>Confirm the people, entities, and properties before requests go out.</p></div><button class="btn btn-outline btn-sm" data-action="edit-portfolio">Edit portfolio</button></div><div class="property-list">${demo.properties.map(p=>`<div class="row-card"><div class="row-main"><div class="property-icon">⌂</div><div><strong>${p.label}</strong><small>${demo.entities.find(e=>e.id===p.entity).name}</small></div></div><div class="row-end"><strong>${p.stage}</strong>${p.confirmed?'<span class="badge green">Confirmed</span>':'<span class="badge warm">Needs confirmation</span>'}</div></div>`).join('')}</div><div class="two-col" style="margin-top:17px"><div class="mini-panel"><h4>Entities & authorization</h4>${demo.entities.map(e=>`<div class="entity-row"><span>${e.name}</span>${stageBadge(e.auth)}</div>`).join('')}</div><div class="mini-panel"><h4>Recent service activity</h4><div class="timeline"><div class="event"><div class="event-icon">✓</div><div><strong>Documents received</strong><p>Portfolio declarations · Nov 18</p></div></div><div class="event"><div class="event-icon">↗</div><div><strong>Follow-up due</strong><p>Request missing endorsements</p></div></div></div></div></div></div>`;
if(state.staffTab==='collection')return `<div class="tab-content"><div class="section-head"><div><h3>Collection requests</h3><p>Staff-led requests follow verified authority and the recipient’s requirements.</p></div><button class="btn btn-primary btn-sm" data-action="prepare-request">Prepare request</button></div><div class="note warning"><strong>Authorization check:</strong> Example Holdings LLC is verified for this demo. Example Rentals LLC still needs separate signer verification before a request can proceed.</div><div class="request-list" style="margin-top:13px">${demo.requests.map((r,i)=>`<div class="row-card"><div class="row-main"><div class="property-icon">✉</div><div><strong>${demo.entities.find(e=>e.id===r.entity).name}</strong><small>${r.contact} · ${r.next}</small></div></div><div class="row-end">${stageBadge(r.status)}<strong>${r.investor?'Investor action needed':'Staff follow-up'}</strong></div></div>`).join('')}</div><div class="note blue" style="margin-top:13px">Some agents or carriers may require their own form, direct investor verification, or another step. This prototype does not send requests.</div></div>`;
if(state.staffTab==='documents')return `<div class="tab-content"><div class="section-head"><div><h3>Documents & matching</h3><p>Receipt, matching, and review are separate steps. Preserve prior versions.</p></div><button class="btn btn-outline btn-sm" data-action="add-document">＋ Add demo document</button></div><div class="property-list"><div class="row-card"><div class="row-main"><div class="property-icon">▤</div><div><strong>Portfolio declarations.pdf</strong><small>Received Nov 18 · Fictional Portfolio Carrier</small></div></div><div class="row-end"><span class="badge cool">Needs matching</span><strong>2 properties possible</strong></div></div><div class="row-card"><div class="row-main"><div class="property-icon">▤</div><div><strong>Example Property One · declarations</strong><small>Received Nov 17 · Fictional Carrier</small></div></div><div class="row-end"><span class="badge warm">Partial</span><strong>Endorsements outstanding</strong></div></div><div class="row-card"><div class="row-main"><div class="property-icon">▤</div><div><strong>Older declarations.pdf</strong><small>Earlier version retained · Nov 12</small></div></div><div class="row-end"><span class="badge gray">Superseded</span><strong>Version 1</strong></div></div></div><div class="note" style="margin-top:13px"><strong>Unknown is not a coverage gap.</strong> Missing documents mean information is incomplete until a qualified reviewer confirms what is needed.</div></div>`;
if(state.staffTab==='review')return `<div class="tab-content"><div class="section-head"><div><h3>Review & publication</h3><p>Only approved findings are shown to the investor.</p></div><button class="btn btn-outline btn-sm" data-action="review-draft">Open review draft</button></div><div class="property-list">${demo.findings.map(f=>`<article class="summary-item"><div style="display:flex;justify-content:space-between;gap:10px"><div class="type">${f.type}</div>${f.status==='Published'?'<span class="badge green">Published</span>':'<span class="badge gray">Internal draft · not client-visible</span>'}</div><p>${f.text}</p><small>Property ${f.property===2?'Two':'One'} · Reviewer: ${f.reviewer} · Evidence: ${f.evidence}</small></article>`).join('')}</div><div class="note blue" style="margin-top:12px">A reported occupancy difference is a potential issue to confirm, not a guaranteed coverage gap. Findings require evidence and licensed review before publication.</div></div>`;
return `<div class="tab-content"><div class="section-head"><div><h3>Activity timeline</h3><p>Track the work separately from published account information.</p></div><button class="btn btn-outline btn-sm" data-action="log-activity">＋ Log activity</button></div><div class="timeline"><div class="event"><div class="event-icon">✓</div><div><strong>Partial response received</strong><p>Nov 18, 2026 · Fictional Existing Agent · 2 files</p></div></div><div class="event"><div class="event-icon">⌕</div><div><strong>Document matching started</strong><p>Nov 18, 2026 · One portfolio file may cover two properties</p></div></div><div class="event"><div class="event-icon">✎</div><div><strong>Investor reported tenant move-in</strong><p>Nov 17, 2026 · Assigned for review · Policy not changed</p></div></div><div class="event"><div class="event-icon">✓</div><div><strong>First entity authority verified</strong><p>Nov 16, 2026 · Example Holdings LLC</p></div></div></div></div>`}
function renderInvestor(){if(state.clientTab==='flow')return renderFlow();return `<div class="layout client-layout"><div class="client-header"><div><div class="eyebrow">Your Sunhaven workspace</div><h1>Hello, ${demo.account.owner.split(' ')[0]}</h1><p>A clear view of what’s organized and what happens next.</p></div><span class="badge green">Private demo portfolio</span></div><nav class="client-nav" aria-label="Investor pages"><button class="${state.clientTab==='home'?'active':''}" data-client-tab="home">Overview</button><button class="${state.clientTab==='portfolio'?'active':''}" data-client-tab="portfolio">My portfolio</button><button class="${state.clientTab==='progress'?'active':''}" data-client-tab="progress">Collection progress</button><button class="${state.clientTab==='review'?'active':''}" data-client-tab="review">Review summary</button></nav>${renderClientTab()}<div class="footnote">Illustrative prototype · Demo people, properties, and policy details are fictional.</div></div>`}
function renderClientTab(){if(state.clientTab==='home')return `<div class="panel client-card"><div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start"><div><div class="eyebrow">Your portfolio, organized</div><h2 style="font-family:Georgia,serif;font-size:22px;font-weight:500;margin:5px 0">We’ll help you bring the details together.</h2><p style="margin:0;color:var(--muted);font-size:13px">Choose how you’d like to get existing policy documents to us. We can follow up with agents on your behalf after the right authorization steps.</p></div><div class="property-icon" style="width:48px;height:48px;font-size:21px">⌂</div></div><div class="client-stats"><div class="stat"><strong>4</strong><span>Properties listed</span></div><div class="stat"><strong>2</strong><span>Business entities</span></div><div class="stat"><strong>1 of 2</strong><span>Collections in progress</span></div></div><div class="note warning" style="margin:14px 0"><strong>One next step:</strong> We need to confirm signing authority for Example Rentals LLC. Your Sunhaven specialist will help with this.</div><button class="btn btn-primary" data-action="start-flow">Continue portfolio setup &nbsp;→</button><button class="btn btn-quiet" style="margin-left:8px" data-client-tab="progress">See collection progress</button></div><div class="split"><div class="panel client-card"><h2>Recently updated</h2><div class="timeline"><div class="event"><div class="event-icon">✓</div><div><strong>Documents received</strong><p>Nov 18 · We’re matching them to your properties.</p></div></div><div class="event"><div class="event-icon">↗</div><div><strong>One collection needs a help call</strong><p>Example Rentals LLC · No agent contact provided yet.</p></div></div></div></div><div class="panel client-card"><h2>Need a hand?</h2><p style="font-size:12px;color:var(--muted)">Your specialist, Jordan Lee, can walk you through what’s needed.</p><button class="btn btn-outline btn-sm" data-action="contact-specialist">Request a call</button></div></div>`;
if(state.clientTab==='portfolio')return `<div class="panel client-card"><div class="section-head"><div><h2 style="margin:0">Properties and entities</h2><p>Check what we have on file. You can correct details anytime.</p></div><button class="btn btn-outline btn-sm" data-action="edit-portfolio">Edit details</button></div><div class="property-list">${demo.properties.map(p=>`<div class="row-card"><div class="row-main"><div class="property-icon">⌂</div><div><strong>${p.label}</strong><small>${demo.entities.find(e=>e.id===p.entity).name}</small></div></div><div class="row-end"><strong>${p.stage}</strong>${p.confirmed?'<span class="badge green">Confirmed</span>':'<span class="badge warm">Please confirm</span>'}</div></div>`).join('')}</div><div class="note" style="margin-top:14px">One policy can cover more than one property. Sunhaven will confirm how each document matches during review.</div><button class="btn btn-primary" style="margin-top:15px" data-action="report-change">Report a property change</button></div>`;
if(state.clientTab==='progress')return `<div class="panel client-card"><div class="eyebrow">Collection progress</div><h2 style="font-family:Georgia,serif;font-size:23px;font-weight:500;margin:4px 0">Sunhaven is working on your documents.</h2><p style="margin:0;color:var(--muted);font-size:13px">Some agents may need to hear from you directly. We’ll tell you when your help is needed.</p><div class="client-progress"><div class="progress-step done"><i>✓</i>Portfolio confirmed</div><div class="progress-step done"><i>✓</i>Authorization reviewed</div><div class="progress-step current"><i>3</i>Collecting documents</div><div class="progress-step"><i>4</i>Licensed review</div></div><div class="property-list"><div class="row-card"><div class="row-main"><div class="property-icon">✉</div><div><strong>Example Holdings LLC</strong><small>Fictional Existing Agent · Partial response received</small></div></div><span class="badge cool">Sunhaven follow-up</span></div><div class="row-card"><div class="row-main"><div class="property-icon">☎</div><div><strong>Example Rentals LLC</strong><small>We’ll arrange a call to learn who to contact.</small></div></div><span class="badge warm">Your help needed</span></div></div><div class="note blue" style="margin-top:14px">You have no immediate task for Example Holdings LLC while Sunhaven follows up. Received documents are still being matched and reviewed.</div><button class="btn btn-outline" style="margin-top:14px" data-action="request-call">Ask for help</button></div>`;
return `<div class="panel client-card"><div class="eyebrow">Reviewer-approved information</div><h2 style="font-family:Georgia,serif;font-size:23px;font-weight:500;margin:4px 0">Your review summary</h2><p style="margin:0;color:var(--muted);font-size:13px">Only published findings appear here. Internal drafts stay with your service team.</p><div class="summary-item"><div style="display:flex;justify-content:space-between;gap:10px"><span class="type">Potential issue · Example Property Two</span><span class="badge green">Published</span></div><p>${demo.findings[0].text}</p><small>${demo.findings[0].evidence} · ${demo.findings[0].reviewer}</small><div style="margin-top:12px"><button class="btn btn-outline btn-sm" data-action="request-call">Talk this through</button></div></div><div class="note warning"><strong>What this means:</strong> This is a prompt to confirm details with your licensed insurance professional. It is not a coverage determination or a confirmed coverage gap.</div></div>`}
function renderFlow(){const steps=['Portfolio','Collection method','Agent contacts','Authorization'];const step=state.flowStep;let content='';if(step===0)content=`<div class="eyebrow">Step 1 of 4</div><h2>Let’s confirm your portfolio.</h2><p>We’ll use this list to organize the collection. Correct anything that has changed.</p><div class="property-confirm">${demo.properties.map((p,i)=>`<label class="check-row"><input type="checkbox" ${p.confirmed?'checked':''} data-prop="${p.id}"><span><strong>${p.label}</strong><small>${demo.entities.find(e=>e.id===p.entity).name} · ${p.stage}</small></span></label>`).join('')}</div><div class="field-wrap"><label class="form-label" for="extra">Anything else we should know?</label><input id="extra" class="field" placeholder="Optional note about your portfolio"></div>`;
if(step===1)content=`<div class="eyebrow">Step 2 of 4</div><h2>How would you like to share documents?</h2><p>You can upload them yourself, ask Sunhaven to coordinate collection, or talk with a specialist.</p><div class="choice-grid"><button class="choice ${state.collection==='assisted'?'selected':''}" data-collection="assisted"><div class="choice-icon">✉</div><strong>Have Sunhaven collect my documents</strong><small>We’ll coordinate with your existing agent after authorization is reviewed.</small></button><button class="choice ${state.collection==='upload'?'selected':''}" data-collection="upload"><div class="choice-icon">↑</div><strong>I’ll upload documents</strong><small>Choose files in a secure production portal. Upload is simulated here.</small></button><button class="choice ${state.collection==='help'?'selected':''}" data-collection="help"><div class="choice-icon">☎</div><strong>Talk with someone first</strong><small>We’ll help you decide what to do next.</small></button><div class="note blue">Collection authorization is separate from appointing an agent or changing coverage.</div></div>`;
if(step===2)content=`<div class="eyebrow">Step 3 of 4</div><h2>Who is your current agent?</h2><p>Share what you know. You don’t need a policy number to get started.</p><div class="field-wrap"><label class="form-label" for="agent">Agent or agency name</label><input class="field" id="agent" value="${esc(state.contact)}" placeholder="Name, if you know it"></div><div class="field-wrap"><label class="form-label" for="email">Email or phone</label><input class="field" id="email" placeholder="Optional contact details"></div><label class="check-row"><input type="checkbox" id="unknownAgent"><span><strong>I’m not sure who my agent is</strong><small>Sunhaven can arrange a help call.</small></span></label>`;
if(step===3)content=`<div class="eyebrow">Step 4 of 4</div><h2>Review the authorization steps.</h2><p>This demo shows the information Sunhaven would confirm before staff requests documents. It is not a legal form or a signature.</p><div class="note warning"><strong>Separate verification needed:</strong> Two LLCs are listed. Signing authority must be confirmed for each entity before its request moves forward.</div><div class="property-list" style="margin-top:13px">${demo.entities.map(e=>`<div class="row-card"><div class="row-main"><div class="property-icon">▤</div><div><strong>${e.name}</strong><small>Purpose: request existing policy documents for review</small></div></div>${stageBadge(e.auth)}</div>`).join('')}</div><label class="check-row" style="margin-top:13px"><input type="checkbox" id="ack"><span><strong>I understand this is a collection request.</strong><small>It does not appoint a new agent, change coverage, or guarantee that an agent can release documents.</small></span></label>`;
return `<div class="layout"><div class="page-head"><div><div class="eyebrow">Guided setup</div><h1>Get your portfolio organized</h1><p>We’ll take this one step at a time. You can ask for help whenever you need it.</p></div><button class="btn btn-quiet btn-sm" data-action="exit-flow">Save and exit</button></div><div class="flow-layout"><aside class="flow-side"><h2>Your setup</h2><div class="step-list">${steps.map((s,i)=>`<div class="step ${i===step?'active':i<step?'done':''}"><span class="step-number">${i<step?'✓':i+1}</span>${s}</div>`).join('')}</div></aside><section class="panel flow-card"><div class="progress-bar"><span style="width:${(step+1)*25}%"></span></div>${content}<div class="flow-actions"><button class="btn btn-outline" data-action="flow-back" ${step===0?'disabled':''}>← Back</button><button class="btn btn-primary" data-action="flow-next">${step===3?'Finish setup':'Continue →'}</button></div></section></div><div class="footnote">Illustrative only · Authorization forms and collection operations require separate approval and review.</div></div>`}
function showModal(title,body,confirmLabel='Save'){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop open" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${title}</h2><p>${body}</p><div id="modal-fields"></div><div class="modal-actions"><button class="btn btn-quiet" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="modal-confirm">${confirmLabel}</button></div></section></div>`;root.querySelector('[data-action="close-modal"]').onclick=()=>root.innerHTML='';root.querySelector('[data-action="modal-confirm"]').onclick=()=>{root.innerHTML='';toast('Saved in this demo only. No request was sent.')}}
function bind(){document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.staffTab=el.dataset.tab;render()});document.querySelectorAll('[data-client-tab]').forEach(el=>el.onclick=()=>{state.clientTab=el.dataset.clientTab;render()});document.querySelectorAll('[data-collection]').forEach(el=>el.onclick=()=>{state.collection=el.dataset.collection;render()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>handleAction(el.dataset.action));document.querySelectorAll('[data-prop]').forEach(el=>el.onchange=()=>{state.propertyConfirmed=el.checked});const ack=document.getElementById('ack');if(ack)ack.onchange=()=>{};}
function handleAction(action){if(action==='start-flow'){state.clientTab='flow';state.flowStep=0;render();return}if(action==='exit-flow'){state.clientTab='home';render();toast('Your demo progress is saved in this session.');return}if(action==='flow-back'){state.flowStep=Math.max(0,state.flowStep-1);render();return}if(action==='flow-next'){if(state.flowStep===2){const field=document.getElementById('agent');state.contact=field?field.value:''}if(state.flowStep===3){if(!document.getElementById('ack')?.checked){toast('Please confirm you understand the demo authorization step.');return}state.clientTab='progress';state.flowStep=0;render();toast('Setup complete in this demo. Sunhaven has not contacted an agent.');return}state.flowStep=Math.min(3,state.flowStep+1);render();return}if(action==='report-change'){showModal('Report a property change','Tell Sunhaven what changed. A specialist will review your report; submitting it does not change a policy.');document.getElementById('modal-fields').innerHTML=`<label class="form-label">Property</label><select class="field"><option>Example Property One</option><option>Example Property Two</option><option>Example Property Three</option><option>Example Property Four</option></select><label class="form-label" style="margin-top:12px">Change type</label><select class="field"><option>Tenant move-in</option><option>Vacancy</option><option>Renovation started or finished</option><option>Property bought or sold</option><option>Other</option></select><label class="form-label" style="margin-top:12px">Effective date</label><input type="date" class="field"><label class="form-label" style="margin-top:12px">Details</label><textarea class="field" rows="3" placeholder="Add context for the review"></textarea>`;document.querySelector('[data-action="modal-confirm"]').onclick=()=>{document.getElementById('modalRoot').innerHTML='';state.changeSubmitted=true;toast('Change sent for review in the demo. Policy not changed.');};return}if(action==='edit-portfolio'){showModal('Update portfolio details','Make a correction or add context for your Sunhaven specialist. This demo does not update a live record.');document.getElementById('modal-fields').innerHTML='<label class="form-label">What should we update?</label><textarea class="field" rows="4" placeholder="Describe the correction"></textarea>';return}if(action==='prepare-request'){showModal('Prepare a collection request','Confirm entity authority and the recipient’s process before staff send any request. This prototype will not contact an agent.','Mark ready for review');return}if(action==='add-document'){toast('Demo limitation: secure file upload is not connected.');return}if(action==='review-draft'){state.staffTab='review';render();toast('Internal drafts are visible to staff only.');return}if(action==='contact-specialist'||action==='request-call'){showModal('Request a call','Jordan Lee will follow up in this demo flow. No real message or call is sent.','Request call');return}if(action==='new-task'){showModal('Create a collection task','Assign a next step to the service team. Demo task only.');document.getElementById('modal-fields').innerHTML='<label class="form-label">Next step</label><input class="field" placeholder="e.g. Confirm signer authority">';return}if(action==='log-activity'){showModal('Log service activity','Record a note for the internal service timeline.');document.getElementById('modal-fields').innerHTML='<label class="form-label">Internal note</label><textarea class="field" rows="3" placeholder="Add a short note"></textarea>';return}if(action==='select-account'){toast('This sample account is the only detailed workspace in the prototype.');return}if(action==='close-modal'){document.getElementById('modalRoot').innerHTML='';return}}
render();
</script>
</body>
</html>
